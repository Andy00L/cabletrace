# Runs the TestSprite suite against a URL, started by hand from the Actions tab. Pull requests do
# not trigger it: the hackathon wants the TestSprite GitHub App to test each pull request, and that
# trigger needs a paid TestSprite plan, so until then main requires no TestSprite check. Once the
# App trigger is set up in the TestSprite portal, its check becomes the required one.
#
# The TestSprite Free plan allows one environment per workspace, so a run against another URL
# points the project's default environment there and back at production afterwards.
name: TestSprite

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to test, for example a pull request's Vercel preview"
        required: true
        default: https://cabletrace.vercel.app

permissions:
  contents: read
  deployments: read

# One run at a time, because each run repoints the same environment. GitHub keeps at most one run
# waiting and cancels an older waiting run when a newer one arrives.
concurrency:
  group: testsprite-gate
  cancel-in-progress: false

jobs:
  testsprite:
    name: TestSprite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The CableTrace frontend project in TestSprite (created with `testsprite project create`).
      TESTSPRITE_PROJECT_ID: 1821635f-b9f9-4187-97ed-855e901ac01f
      # Pinned so a CLI release never changes the gate without a pull request.
      TESTSPRITE_CLI_VERSION: 0.14.0
      # Where the project's default environment points between runs.
      PRODUCTION_URL: https://cabletrace.vercel.app
    steps:
      - name: Check the API key is available
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        run: |
          if [ -z "$TESTSPRITE_API_KEY" ]; then
            echo "::error title=TestSprite::TESTSPRITE_API_KEY is not available to this run."
            exit 1
          fi

      # The CLI runs on Node (it needs ^20.19, ^22.13 or 24+); Bun installs it, as everywhere in this repo.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2

      - name: Install the TestSprite CLI
        run: |
          bun add --global "@testsprite/testsprite-cli@$TESTSPRITE_CLI_VERSION"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Point the project at the URL to test
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
          TARGET_URL: ${{ inputs.url }}
        run: testsprite project update "$TESTSPRITE_PROJECT_ID" --url "$TARGET_URL"

      - name: Run the suite
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        # Under GITHUB_ACTIONS the CLI writes failure annotations and a job summary table itself.
        run: |
          testsprite test run --all --project "$TESTSPRITE_PROJECT_ID" \
            --wait --timeout 900 --report junit --report-file testsprite-junit.xml

      - name: Keep the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testsprite-junit
          path: testsprite-junit.xml
          if-no-files-found: ignore

      # Cleanup only: a failed restore is a warning, not a red check, since the tests already ran.
      # The next run repoints the environment anyway.
      - name: Point the project back at production
        if: always()
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        run: |
          testsprite project update "$TESTSPRITE_PROJECT_ID" --url "$PRODUCTION_URL" \
            || echo "::warning title=TestSprite::Could not point the project back at $PRODUCTION_URL."
